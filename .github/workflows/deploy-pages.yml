  # ============================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 2.1 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2.2 设置 Pages 环境
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 2.3 上传站点产物
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_site/
          retention-days: 30

      # 2.4 部署到 Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2.5 部署元数据
      - name: Deploy metadata
        run: |
          echo "Deploy SHA: ${{ needs.validate.outputs.deploy_sha }}"
          echo "Deploy TS: ${{ needs.validate.outputs.deploy_ts }}"
          echo "Dataset count: ${{ needs.validate.outputs.dataset_count }}"
          echo "Archive count: ${{ needs.validate.outputs.archive_count }}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"

      # 2.6 生成部署元数据文件
      - name: Generate deploy metadata
        run: |
          cat > web_site/deploy_meta.json <<EOF
          {
            "deploy_sha": "${{ needs.validate.outputs.deploy_sha }}",
            "deploy_ts": "${{ needs.validate.outputs.deploy_ts }}",
            "dataset_count": ${{ needs.validate.outputs.dataset_count }},
            "archive_count": ${{ needs.validate.outputs.archive_count }},
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF

  # ============================================================
  # Job 2b: 部署失败自动重试 (P25 T3)
  #        primary deploy 失败 -> 重新 checkout / 上传 / 部署一次
  # ============================================================
  deploy-retry:
    name: Deploy Retry (P25 T3)
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact (retry)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_site/
          retention-days: 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        uses: actions/deploy-pages@v4
      - name: Retry result
        run: |
          echo "## Retry deploy: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Page URL: ${{ steps.deployment_retry.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Job 2c: 网络异常降级 - API 提交模式 (P25 T3)
  #        github.com:443 不可达 且 Actions 部署连续两次失败
  #        -> 改用 api.github.com Contents API 直写 gh-pages 分支
  # ============================================================
  deploy-fallback:
    name: Deploy Fallback / API Contents Mode (P25 T3)
    runs-on: ubuntu-latest
    needs: [deploy, deploy-retry]
    if: ${{ always() && needs.deploy.result != 'success' && needs.deploy-retry.result != 'success' }}
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SITE_DIR: web_site
      TARGET_BRANCH: gh-pages
      TOKEN: ${{ secrets.PAGES_FALLBACK_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe github.com / api.github.com reachability
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          echo "========== P25 T3 network probe =========="
          ok=0
          for i in 1 2 3; do
            if curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null https://github.com/ 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          apiok=0
          for i in 1 2 3; do
            if curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null https://api.github.com/ 2>/dev/null; then apiok=1; break; fi
            sleep 3
          done
          echo "github_ok=$ok" >> "$GITHUB_OUTPUT"
          echo "api_ok=$apiok" >> "$GITHUB_OUTPUT"
          echo "| Target | Reachable |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = "1" ] && echo "| github.com:443 | yes |" >> "$GITHUB_STEP_SUMMARY" || echo "| github.com:443 | no |" >> "$GITHUB_STEP_SUMMARY"
          [ "$apiok" = "1" ] && echo "| api.github.com:443 | yes |" >> "$GITHUB_STEP_SUMMARY" || echo "| api.github.com:443 | no |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fallback gate - network is healthy
        if: steps.probe.outputs.github_ok == '1'
        run: |
          echo "::error title=Network fallback not applicable::github.com:443 is reachable, so the Actions deploy failed for a non-network reason. Read the deploy job log instead of falling back."
          exit 1

      - name: Fallback gate - api.github.com unreachable
        if: steps.probe.outputs.api_ok != '1'
        run: |
          echo "::error title=Both endpoints unreachable::github.com:443 and api.github.com:443 are both unreachable; no fallback path is available."
          exit 1

      - name: Publish site to gh-pages via Contents API
        id: push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """DSHD-P25 T3: API-Contents fallback publisher.
          
          When github.com:443 is unreachable and the Actions Pages deployment has failed
          twice, publish the built site directly to the gh-pages branch using the GitHub
          Contents API on api.github.com (a different host than github.com).
          
          Environment (injected by the workflow):
            GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_REF_NAME, TOKEN
            SITE_DIR (default web_site), TARGET_BRANCH (default gh-pages)
          """
          import base64
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          
          OWNER_REPO = os.environ.get("GITHUB_REPOSITORY", "")
          OWNER, REPO = (OWNER_REPO.split("/") + [""])[:2]
          API = "https://api.github.com"
          TOKEN = os.environ.get("TOKEN") or os.environ.get("GITHUB_TOKEN")
          SITE = os.environ.get("SITE_DIR", "web_site")
          BRANCH = os.environ.get("TARGET_BRANCH", "gh-pages")
          COMMIT_SHA = os.environ.get("GITHUB_SHA", "")
          BASE_BRANCH = os.environ.get("GITHUB_REF_NAME", "main")
          OUT = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          GH_OUT = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          
          SKIP_SUFFIX = (".bak_p24",)
          
          
          def req(method, path, body=None):
              url = API + "/repos/" + OWNER_REPO + path
              data = json.dumps(body).encode("utf-8") if body is not None else None
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header("Authorization", "Bearer " + TOKEN)
              r.add_header("Accept", "application/vnd.github+json")
              r.add_header("X-GitHub-Api-Version", "2022-11-28")
              r.add_header("User-Agent", "dshd-p25-deploy-fallback")
              if data:
                  r.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      raw = resp.read()
                      return resp.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, {"message": raw.decode("utf-8", "replace")[:300]}
              except Exception as e:
                  return -1, {"message": "%s: %s" % (type(e).__name__, e)}
          
          
          def call(method, path, body=None, tries=3):
              last = None
              for i in range(1, tries + 1):
                  st, bd = req(method, path, body)
                  if 200 <= st < 300:
                      return bd
                  last = (st, bd)
                  if st in (401, 403, 404, 409, 422):
                      break
                  time.sleep(2 ** i)
              raise RuntimeError("API %s %s -> %s %s" % (method, path, last[0], str(last[1])[:200]))
          
          
          def summary(text):
              print(text)
              with open(OUT, "a", encoding="utf-8") as f:
                  f.write(text + "\n")
          
          
          def main():
              if not OWNER_REPO or not TOKEN:
                  raise SystemExit("GITHUB_REPOSITORY / TOKEN not set")
              if not os.path.isdir(SITE):
                  raise SystemExit("site dir missing: " + SITE)
          
              # 1. collect site files
              files = []
              for dp, dn, fn in os.walk(SITE):
                  for f in fn:
                      if f.endswith(SKIP_SUFFIX):
                          continue
                      p = os.path.join(dp, f)
                      rel = os.path.relpath(p, ".").replace(os.sep, "/")
                      files.append((rel, os.path.getsize(p)))
              files.sort()
              total = sum(s for _, s in files)
              summary("### Deploy fallback (API-Contents mode)")
              summary("")
              summary("site files to publish: **%d** (%s)" % (len(files), "{:,}".format(total) + " B"))
          
              # 2. ensure the target branch exists
              st, ref = req("GET", "/git/ref/heads/" + BRANCH)
              if st == 200:
                  base = ref["object"]["sha"]
                  summary("target branch `%s` exists @ `%s`" % (BRANCH, base[:12]))
              else:
                  st2, mainref = req("GET", "/git/ref/heads/" + BASE_BRANCH)
                  if st2 != 200:
                      raise RuntimeError("cannot resolve base branch %s: %s" % (BASE_BRANCH, mainref))
                  basesha = mainref["object"]["sha"]
                  bd = call("POST", "/branches", {"branch": BRANCH, "sha": basesha})
                  base = bd["commit"]["sha"]
                  summary("created branch `%s` @ `%s` (from `%s`)" % (BRANCH, base[:12], BASE_BRANCH))
          
              # 3. existing tree in a single call
              existing = {}
              st, tree = req("GET", "/git/trees/" + base + "?recursive=1")
              if st == 200 and isinstance(tree.get("tree"), list):
                  for e in tree["tree"]:
                      if e.get("type") == "blob":
                          existing[e["path"]] = e["sha"]
              summary("blobs already on `%s`: **%d**" % (BRANCH, len(existing)))
          
              # 4. create / update each file
              msg = "ci(pages-fallback): publish DSHD-P25 site @" + COMMIT_SHA[:12]
              pushed, updated, skipped = 0, 0, 0
              errors = []
              for rel, sz in files:
                  with open(rel, "rb") as fp:
                      b64 = base64.b64encode(fp.read()).decode("ascii")
                  body = {"message": msg, "content": b64, "encoding": "base64", "branch": BRANCH}
                  if rel in existing:
                      body["sha"] = existing[rel]
                      action = "update"
                  else:
                      action = "create"
                  try:
                      call("PUT", "/contents/" + rel, body)
                  except RuntimeError as e:
                      errors.append("%s %s: %s" % (action, rel, str(e)[:160]))
                      continue
                  if action == "create":
                      pushed += 1
                  else:
                      updated += 1
              if errors:
                  summary("")
                  summary("**%d** file(s) failed:" % len(errors))
                  for e in errors[:20]:
                      summary("- " + e)
          
              # 5. best effort: point the Pages source at the gh-pages branch
              st, bd = req("PATCH", "/pages", {"source": {"branch": BRANCH, "path": "/"}})
              switched = 200 <= st < 300
              if switched:
                  summary("Pages source switched to `%s`" % BRANCH)
              else:
                  summary("`PATCH /repos/.../pages` -> %s (needs `admin:public_repo`; "
                          "repo token cannot change the Pages source)." % st)
          
              report = {
                  "mode": "api_contents",
                  "branch": BRANCH,
                  "base_sha": base[:12],
                  "files_total": len(files),
                  "pushed_new": pushed,
                  "updated": updated,
                  "unchanged_skipped": skipped,
                  "failed": len(errors),
                  "commit_sha": COMMIT_SHA,
                  "github_com_reachable": False,
                  "api_github_com_reachable": True,
                  "pages_source_switched": switched,
              }
              open("deploy_fallback_report.json", "w", encoding="utf-8").write(json.dumps(report, indent=2))
              summary("")
              summary("| Metric | Value |")
              summary("|--------|-------|")
              summary("| Files published | %d new + %d updated |" % (pushed, updated))
              summary("| Failed | %d |" % len(errors))
              summary("| Commit | `%s` |" % COMMIT_SHA[:12])
              summary("| Pages source switched | %s |" % switched)
              if errors:
                  raise SystemExit("fallback completed with %d failed file(s)" % len(errors))
              with open(GH_OUT, "a", encoding="utf-8") as f:
                  f.write("done=1\n")
          
          
          if __name__ == "__main__":
              main()
          PYEOF

      - name: Fallback report
        run: |
          cat deploy_fallback_report.json 2>/dev/null || echo "no fallback report"

  # ============================================================
  # Job 3: 部署通知 (P25 T3)
  # ============================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, deploy-retry, deploy-fallback]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## DSHD-P25 Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Primary deploy | ${{ needs.deploy.result }} |"
            echo "| Auto retry | ${{ needs.deploy-retry.result }} |"
            echo "| API-Contents fallback | ${{ needs.deploy-fallback.result }} |"
            echo "| SHA | ${{ needs.validate.outputs.deploy_sha }} |"
            echo "| Datasets | ${{ needs.validate.outputs.dataset_count }} |"
            echo "| Archived | ${{ needs.validate.outputs.archive_count }} |"
            echo "| URL | ${{ needs.deploy.outputs.page_url }} |"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
