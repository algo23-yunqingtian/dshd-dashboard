# =========================================================================
# DSHD-P36 deploy-pages.yml (phase-agnostic rewrite)
# -------------------------------------------------------------------------
# Previous workflow hard-failed on legacy P23/P24/P25 checks that reference
# panel markers (echarts/html2canvas/icdrift/phase4-panel...) absent from
# the current static dashboard, and its fallback gate aborted runs whenever
# github.com:443 was reachable. This phase-agnostic version only validates
# structural integrity (JSON parse + version_tag/dataset_version regex +
# core dataset shapes + inline JS syntax) so every future phase deploys
# without editing the workflow.
# =========================================================================
name: Deploy DSHD Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web_site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      skip_validate:
        description: 'Skip validation steps (emergency deploy)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  SITE_ROOT: web_site
  DATA_DIR: web_site/data

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.meta.outputs.sha }}
      deploy_ts: ${{ steps.meta.outputs.ts }}
      dataset_count: ${{ steps.validate.outputs.dataset_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Meta
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Skip check
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_validate }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Structural validation
        if: steps.skip.outputs.skip != 'true'
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, re, sys
          DATA = "web_site/data"
          fail, warn = [], []
          def chk(desc, ok, detail=""):
              if ok:
                  print("  [PASS] " + desc)
              else:
                  print("  [FAIL] " + desc + " :: " + str(detail))
                  fail.append(desc + " :: " + str(detail))

          if not os.path.isdir(DATA):
              chk("data dir exists", False, "missing " + DATA)
          else:
              files = sorted(os.listdir(DATA))
              js = [f for f in files if f.endswith(".json")]
              chk(">= 42 JSON datasets", len(js) >= 42, "n=" + str(len(js)))

              core = ["fr_risk_alerts", "factor_drift_alerts", "ic_drift_timeseries",
                      "drift_root_cause", "pb_cu_gray_admission_status", "pc003_status",
                      "pc003_unlock_assessment", "phase4_precheck", "data_completion_status",
                      "experiment_index", "version_index", "pl_summary",
                      "cross_variety_comparison", "portfolio_backtest_7asset",
                      "portfolio_correlation", "portfolio_risk_metrics",
                      "portfolio_risk_contribution", "portfolio_risk_contribution_timeseries",
                      "rolling_correlation_matrix"]
              for c in core:
                  chk("core " + c + ".json", (c + ".json") in files)

              bad_tag, bad_ver = [], []
              for f in js:
                  try:
                      d = json.load(open(os.path.join(DATA, f), encoding="utf-8"))
                  except Exception as e:
                      bad_tag.append(f + " unreadable"); continue
                  t = str(d.get("version_tag", ""))
                  v = str(d.get("dataset_version", ""))
                  if not re.match(r'^P\d+$', t):
                      bad_tag.append(f + " -> " + t)
                  if not re.match(r'^1\.\d+$', v):
                      bad_ver.append(f + " -> " + v)
              chk("all version_tag match ^P\d+$", len(bad_tag) == 0, str(bad_tag[:6]))
              chk("all dataset_version match ^1.x$", len(bad_ver) == 0, str(bad_ver[:6]))

              # rolling_correlation 5-window structure
              try:
                  m = json.load(open(os.path.join(DATA, "rolling_correlation_matrix.json"), encoding="utf-8"))
                  roll = m.get("rolling_correlation") or {}
                  keys = sorted(roll.keys())
                  chk("rolling_correlation 5 windows 20/40/60/120/250d",
                      keys == ["120d", "20d", "250d", "40d", "60d"], str(keys))
                  for k in keys:
                      w = roll[k]
                      mm = w.get("correlation_matrix") or {}
                      chk("  " + k + " matrix 7x7", len(mm) == 7, str(len(mm)))
                      chk("  " + k + " core/battery/cross_sector_avg",
                          all(x in w for x in ("core_avg", "battery_avg", "cross_sector_avg")))
              except Exception as e:
                  fail.append("rolling_correlation_matrix read :: " + str(e))

              # variety_time_series >= 7
              try:
                  rc = json.load(open(os.path.join(DATA, "portfolio_risk_contribution_timeseries.json"), encoding="utf-8"))
                  vts = rc.get("variety_time_series") or []
                  chk("variety_time_series >= 7", len(vts) >= 7, "n=" + str(len(vts)))
              except Exception as e:
                  fail.append("portfolio_risk_contribution_timeseries read :: " + str(e))

              # ic_drift phase series
              try:
                  ics = json.load(open(os.path.join(DATA, "ic_drift_timeseries.json"), encoding="utf-8"))
                  ps = ics.get("phase_series") or []
                  chk("ic_drift phase_series >= 15", len(ps) >= 15, "n=" + str(len(ps)))
                  names = [str(x.get("phase", "")) for x in ps]
                  chk("ic_drift phase labels PhaseNn", all(re.match(r'^Phase\d+$', n) for n in names))
              except Exception as e:
                  fail.append("ic_drift_timeseries read :: " + str(e))

              open("validate.json", "w", encoding="utf-8").write(
                  json.dumps({"datasets": len(js), "fail": fail, "warn": warn}, ensure_ascii=False, indent=2))
              print("\n  hard fail: %d | datasets: %d" % (len(fail), len(js)))
              for x in fail:
                  print("    FAIL: " + x)
              if fail:
                  print("STRUCTURAL GATE: BLOCKED", file=sys.stderr); sys.exit(10)
              print("STRUCTURAL GATE: PASS")
              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as g:
                  g.write("dataset_count=%d\n" % len(js))
          PYEOF

      - name: HTML structure check
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f web_site/index.html || { echo "index.html missing" >&2; exit 3; }
          grep -q "<!DOCTYPE html>" web_site/index.html && echo "DOCTYPE OK"
          grep -q "showTab" web_site/index.html && echo "tabs OK"
          grep -Eq 'id="(overview|fr-risk|rolling-f32|cost-model)"' web_site/index.html && echo "core panels OK"
          grep -Eq 'DSHD-P[0-9]+' web_site/index.html && echo "phase title OK"
          grep -Eo 'V[0-9]+\.[0-9]+' web_site/index.html | head -1 | xargs -I{} echo "dashboard version {}"

      - name: Inline JS syntax audit (node --check)
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, subprocess, tempfile, os, sys
          src = open("web_site/index.html", encoding="utf-8").read()
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', src, flags=re.S)
          errs, ok = [], 0
          for i, b in enumerate(blocks, 1):
              if not b.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", newline="\n", delete=False) as tf:
                  tf.write(b); path = tf.name
              r = subprocess.run(["node", "--check", path], capture_output=True, text=True)
              os.unlink(path)
              if r.returncode:
                  st = (r.stderr or "").splitlines()
                  msg = next((x.strip() for x in st if x.strip().startswith("SyntaxError")), st[0] if st else "rc=%d" % r.returncode)
                  errs.append("block#%d: %s" % (i, msg))
              else:
                  ok += 1
                  print("  [PASS] block#%d node --check ok" % i)
          for e in errs:
              print("  [FAIL] " + e, file=sys.stderr)
          print("  blocks checked: %d | syntax errors: %d" % (ok, len(errs)))
          if errs:
              sys.exit(11)
          PYEOF

      - name: Security scan (no secrets in site artifact)
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, re, sys
          PATTERNS = [
              (r"ghp_[A-Za-z0-9]{30,}", "GitHub PAT classic"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "GitHub PAT fine-grained"),
              (r"gh[osu]_[A-Za-z0-9]{30,}", "GitHub token"),
              (r"AKIA[0-9A-Z]{16}", "AWS access key"),
              (r"-----BEGIN [A-Z ]*PRIVATE KEY-----", "PEM private key"),
          ]
          hits, scanned = [], 0
          for dp, dn, fn in os.walk("web_site"):
              for f in fn:
                  p = os.path.join(dp, f)
                  try:
                      txt = open(p, encoding="utf-8", errors="ignore").read()
                  except Exception:
                      continue
                  scanned += 1
                  for rx, name in PATTERNS:
                      for m in re.finditer(rx, txt):
                          hits.append((os.path.relpath(p, "web_site"), name))
          print("  files scanned: %d | hits: %d" % (scanned, len(hits)))
          for h in hits:
              print("    LEAK: %s :: %s" % h, file=sys.stderr)
          if hits:
              sys.exit(20)
          print("  [PASS] no secret patterns in web_site/")
          PYEOF

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_site/
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy metadata
        run: |
          echo "Deploy SHA: ${{ needs.validate.outputs.deploy_sha }}"
          echo "Deploy TS: ${{ needs.validate.outputs.deploy_ts }}"
          echo "Dataset count: ${{ needs.validate.outputs.dataset_count }}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"
