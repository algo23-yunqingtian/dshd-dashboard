# =========================================================================
# DSHD-P23 Github Actions CI · 自动部署流水线
# =========================================================================
# 位置: .github/workflows/deploy-pages.yml
# 作用: 代码推送 → 自动构建 → 自动发布上线至 GitHub Pages
# 触发: push (main/master) + pull_request + workflow_dispatch
# 权限: contents:read / pages:write / id-token:write
# =========================================================================
name: Deploy DSHD-P24 to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web_site/**'
      - '.github/workflows/deploy-pages.yml'
      - 'data/**'
      - 'archive/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'web_site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      skip_validate:
        description: 'Skip validation steps (emergency deploy)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# 权限最小化
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制: 同一分支只允许一个部署
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

# 全局环境变量
env:
  NODE_VERSION: 20
  PYTHON_VERSION: '3.12'
  SITE_ROOT: web_site
  DATA_DIR: web_site/data
  ARCHIVE_DIR: web_site/archive
  JS_DIR: web_site/js
  INDEX_FILE: web_site/index.html

jobs:
  # ============================================================
  # Job 1: 构建 + 静态校验
  # ============================================================
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.meta.outputs.sha }}
      deploy_ts: ${{ steps.meta.outputs.ts }}
      dataset_count: ${{ steps.validate.outputs.dataset_count }}
      archive_count: ${{ steps.validate.outputs.archive_count }}
    steps:
      # 1.1 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Meta
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # 1.2 跳过开关 (紧急部署)
      - name: Skip check
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_validate }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # 1.2b  P25 T3: 前置静态数据校验 (PRE-FLIGHT STATIC DATA GATE)
      #       先于 JSON/HTML/归档 校验执行; 任一硬门禁失败即中止部署
      # ============================================================
      - name: 'P25 T3: Pre-flight static data validation'
        if: steps.skip.outputs.skip != 'true'
        id: preflight_p25
        shell: bash
        run: |
          set -euo pipefail
          echo "========== P25 T3 pre-flight static data validation =========="
          python3 - <<'PYEOF'
          import json, os, sys
          DATA = "web_site/data"
          CORE18 = [
                        "fr_risk_alerts",
              "factor_drift_alerts",
              "ic_drift_timeseries",
              "drift_root_cause",
              "pb_cu_gray_admission_status",
              "pc003_status",
              "pc003_unlock_assessment",
              "phase4_precheck",
              "data_completion_status",
              "experiment_index",
              "version_index",
              "pl_summary",
              "cross_variety_comparison",
              "portfolio_backtest",
              "portfolio_correlation",
              "portfolio_risk_metrics",
              "portfolio_risk_contribution",
              "rolling_correlation_matrix",
          ]
          fail, warn = [], []
          def chk(desc, ok, detail=""):
              if ok:
                  print("  [PASS] " + desc)
              else:
                  print("  [FAIL] " + desc + " :: " + str(detail))
                  fail.append(desc + " :: " + str(detail))
          def wrn(desc, detail=""):
              print("  [WARN] " + desc + (" :: " + str(detail) if detail else ""))
              warn.append(desc)
          print("  --- A. 18 core datasets present ---")
          files = sorted(os.listdir(DATA))
          js = [f for f in files if f.endswith(".json")]
          for c in CORE18:
              chk("  core " + c + ".json", (c + ".json") in files)
          n_core = len([c for c in CORE18 if (c + ".json") in files])
          chk("core coverage 18/18", n_core == 18, str(n_core) + "/18")
          print("  --- B. version_tag / dataset_version consistency ---")
          bad_tag, no_tag, bad_ver = [], [], []
          for f in js:
              try:
                  d = json.load(open(os.path.join(DATA, f), encoding="utf-8"))
              except Exception as e:
                  bad_tag.append(f + " (unreadable " + str(e) + ")"); continue
              t = d.get("version_tag", "")
              v = d.get("dataset_version", "")
              if not t: no_tag.append(f)
              elif t != "P25": bad_tag.append(f + " -> " + str(t))
              if str(v) != "1.7": bad_ver.append(f + " -> " + str(v))
          chk("all version_tag == P25", len(bad_tag) == 0, str(bad_tag[:6]))
          chk("all dataset_version == 1.7", len(bad_ver) == 0, str(bad_ver[:6]))
          wrn("datasets without version_tag", str(no_tag[:6]))
          print("  --- C. P25 new-dataset structural integrity ---")
          try:
              ics = json.load(open(os.path.join(DATA, "ic_drift_timeseries.json"), encoding="utf-8"))
              ps = ics.get("phase_series") or []
              chk("ic_drift phase_series >= 17 phases", len(ps) >= 17, "n=" + str(len(ps)))
              names = [str(x.get("phase", "")) for x in ps]
              chk("ic_drift covers Phase6..Phase25", "Phase6" in names and "Phase25" in names, str(names[:2]) + ".." + str(names[-2:]))
              chk("ic_drift threshold_pct == 5.0", abs(float(ics.get("threshold_pct", 0)) - 5.0) < 1e-9)
              chk("ic_drift over_threshold_phases == 2", int((ics.get("summary") or {}).get("over_threshold_phases", 0)) == 2)
              chk("ic_drift summary.current_ic == 0.0578", abs(float((ics.get("summary") or {}).get("current_ic", 0)) - 0.0578) < 1e-9)
          except Exception as e:
              fail.append("ic_drift_timeseries read :: " + str(e))
          try:
              r = json.load(open(os.path.join(DATA, "drift_root_cause.json"), encoding="utf-8"))
              chk("drift_root_cause factor_drift == 12", len(r.get("factor_drift") or []) == 12)
              chk("drift_root_cause schemes == 4", len(r.get("schemes") or []) == 4)
              chk("drift_root_cause recommended_scheme == D", r.get("recommended_scheme") == "D")
              chk("drift_root_cause priority == P0", r.get("priority") == "P0")
          except Exception as e:
              fail.append("drift_root_cause read :: " + str(e))
          try:
              m = json.load(open(os.path.join(DATA, "rolling_correlation_matrix.json"), encoding="utf-8"))
              roll = m.get("rolling_correlation") or {}
              keys = sorted(roll.keys())
              chk("rolling_correlation 5 windows 20/40/60/120/250d", keys == ["120d", "20d", "250d", "40d", "60d"], str(keys))
              for k in keys:
                  w = roll[k]
                  mm = w.get("correlation_matrix") or {}
                  chk("  " + k + " matrix 7x7", len(mm) == 7, str(len(mm)))
                  chk("  " + k + " core/battery/cross_sector avg", all(x in w for x in ("core_avg", "battery_avg", "cross_sector_avg")))
          except Exception as e:
              fail.append("rolling_correlation_matrix read :: " + str(e))
          print("  --- D. cross-dataset alert consistency ---")
          try:
              fr = json.load(open(os.path.join(DATA, "fr_risk_alerts.json"), encoding="utf-8"))
              al = fr.get("alerts") or []
              ids = [str(a.get("id", "")) for a in al]
              chk("fr_risk_alerts total == 15", len(al) == 15, "n=" + str(len(al)))
              chk("fr_risk PG25-ICDRIFT-015 present", any("PG25-ICDRIFT-015" in i for i in ids), str(ids[-3:]))
              blk = fr.get("ic_drift_block") or {}
              chk("fr_risk ic_drift_block.active == true", blk.get("active") is True)
              chk("fr_risk ic_drift_block.drift_pct == 5.2", abs(float(blk.get("drift_pct", 0)) - 5.2) < 1e-9)
          except Exception as e:
              fail.append("fr_risk_alerts read :: " + str(e))
          out = {"core18_ok": n_core, "datasets": len(js), "fail": fail, "warn": warn}
          open("validate_p25.json", "w", encoding="utf-8").write(json.dumps(out, ensure_ascii=False, indent=2))
          print("\n  hard fail: %d | warn: %d" % (len(fail), len(warn)))
          for x in fail: print("    FAIL: " + x)
          if fail:
              print("PRE-FLIGHT GATE: BLOCKED", file=sys.stderr); sys.exit(10)
          print("PRE-FLIGHT GATE: PASS")
          PYEOF
      # ============================================================
      # 1.2c  P25 T3: 内联 JS 语法审计 (node --check)
      #        阻断 "整页 JS 解析失败" 类缺陷上线 (P24 曾因 const rc 重复声明整页不渲染)
      # ============================================================
      - name: 'P25 T3: Inline JS syntax audit (node --check)'
        if: steps.skip.outputs.skip != 'true'
        id: js_audit_p25
        shell: bash
        run: |
          set -euo pipefail
          echo "========== P25 T3 inline JS syntax audit =========="
          python3 - <<'PYEOF'
          import re, subprocess, tempfile, os, sys
          src = open("web_site/index.html", encoding="utf-8").read()
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', src, flags=re.S)
          errs, ok = [], 0
          for i, b in enumerate(blocks, 1):
              if not b.strip(): continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8",
                                              newline="\n", delete=False) as tf:
                  tf.write(b); path = tf.name
              r = subprocess.run(["node", "--check", path], capture_output=True, text=True)
              os.unlink(path)
              st = (r.stderr or "").splitlines()
              if r.returncode:
                  msg = next((x.strip() for x in st if x.strip().startswith("SyntaxError")), st[0] if st else "rc=%d" % r.returncode)
                  errs.append("block#%d: %s" % (i, msg))
              else:
                  ok += 1
                  print("  [PASS] block#%d node --check ok (%d chars)" % (i, len(b)))
          for e in errs: print("  [FAIL] " + e, file=sys.stderr)
          print("  blocks checked: %d | syntax errors: %d" % (ok, len(errs)))
          if errs: sys.exit(11)
          PYEOF
          grep -q "icdrift" web_site/index.html && echo "  P25 IC drift panel container OK"
          grep -q "renderICDriftPanel" web_site/index.html && echo "  P25 renderICDriftPanel OK"
          grep -q "correlation-band-chart" web_site/index.html && echo "  P25 correlation band chart OK"
          grep -q "fr-risk-block-status" web_site/index.html && echo "  P25 FR-RISK block status OK"
      # ============================================================
      # 1.2d  P25 T3: 安全扫描 (secret leakage / 明文凭证 / 依赖钉住)
      # ============================================================
      - name: 'P25 T3: Security scan'
        if: steps.skip.outputs.skip != 'true'
        id: secscan_p25
        shell: bash
        run: |
          set -euo pipefail
          echo "========== P25 T3 security scan =========="
          python3 - <<'PYEOF'
          import os, re, sys, json
          ROOT = "web_site"
          PATTERNS = [
              (r"ghp_[A-Za-z0-9]{30,}",                   "GitHub PAT classic"),
              (r"github_pat_[A-Za-z0-9_]{20,}",           "GitHub PAT fine-grained"),
              (r"gh[osu]_[A-Za-z0-9]{30,}",               "GitHub token"),
              (r"AKIA[0-9A-Z]{16}",                       "AWS access key"),
              (r"-----BEGIN [A-Z ]*PRIVATE KEY-----",      "PEM private key"),
              (r"aws_secret_access_key\s*[:=]\s*['\"]?[A-Za-z0-9/+]{20,}", "AWS secret"),
              (r"PRIVATE-TOKEN\s*[:=]\s*[A-Za-z0-9_\-]{20,}",  "GitLab PAT"),
          ]
          SKIP_EXT = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".woff", ".woff2", ".ttf"}
          hits, scanned = [], 0
          for dp, dn, fn in os.walk(ROOT):
              for f in fn:
                  if os.path.splitext(f)[1].lower() in SKIP_EXT: continue
                  p = os.path.join(dp, f)
                  try:
                      txt = open(p, encoding="utf-8", errors="ignore").read()
                  except Exception:
                      continue
                  scanned += 1
                  for rx, name in PATTERNS:
                      for m in re.finditer(rx, txt):
                          hits.append((os.path.relpath(p, ROOT), name, m.group(0)[:24]))
          print("  files scanned: %d | secret-pattern hits: %d" % (scanned, len(hits)))
          for h in hits: print("    LEAK: %s :: %s :: %s" % h, file=sys.stderr)
          if hits:
              print("SECURITY SCAN: FAILED", file=sys.stderr); sys.exit(20)
          PYEOF
          echo "  -- plaintext credential files --"
          if ls web_site/**/.env web_site/.env web_site/*.pem web_site/*.key 2>/dev/null | grep -q .; then
              echo "  [FAIL] credential file present in site artifact" >&2; exit 21
          fi
          echo "  [PASS] no credential file in artifact"
          echo "  -- non-HTTPS external resource check --"
          if grep -nE 'src="http://' web_site/index.html | grep -q .; then
              echo "  [FAIL] non-HTTPS external resource" >&2; exit 22
          fi
          echo "  [PASS] all external resources HTTPS"
          python3 - <<'PYEOF'
          import re, json
          src = open("web_site/index.html", encoding="utf-8").read()
          cdns = sorted(set(re.findall(r'https://[^"\)]+?\.(?:js|css)(?![A-Za-z0-9])', src)))
          unpinned = [c for c in cdns if not re.search(r'(?:/v[0-9]+/|@[0-9]+(?:\.[0-9]+)?|/dist/)', c)]
          evals = len(re.findall(r"\beval\s*\(", src))
          inner = len(re.findall(r"\.innerHTML\s*=", src))
          print("  CDN endpoints: %d | unpinned: %d | eval() calls: %d | innerHTML assignments: %d" % (len(cdns), len(unpinned), evals, inner))
          for u in unpinned: print("    UNPINNED CDN: " + u)
          if evals: print("    ADVISORY: eval() present")
          json.dump({"files_scanned": 0, "secret_hits": 0, "cdn_endpoints": len(cdns),
                    "unpinned_cdn": unpinned, "eval_calls": evals, "innerHTML_assignments": inner},
                    open("security_scan.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PYEOF
          echo "  [PASS] security scan clean"
      # 1.3 JSON 数据集完整性校验
      - name: Validate JSON datasets
        if: steps.skip.outputs.skip != 'true'
        id: validate
        run: |
          echo "========== JSON dataset validation =========="
          python3 - <<'PYEOF'
          import json, os, sys, hashlib
          data_dir = 'web_site/data'
          if not os.path.isdir(data_dir):
              print(f"ERROR: data dir not found: {data_dir}", file=sys.stderr); sys.exit(1)
          files = sorted(os.listdir(data_dir))
          json_count = 0
          for f in files:
              if not f.endswith('.json'): continue
              p = os.path.join(data_dir, f)
              try:
                  with open(p, 'r', encoding='utf-8') as fp:
                      json.load(fp)
                  sz = os.path.getsize(p)
                  md5 = hashlib.md5(open(p,'rb').read()).hexdigest()
                  print(f"  OK  {f:40s} {sz:>8,}B  md5 {md5}")
                  json_count += 1
              except Exception as e:
                  print(f"  FAIL {f}: {e}", file=sys.stderr); sys.exit(2)
          print(f"\nJSON files validated: {json_count}")
          print(f"Total data files: {len(files)}")
          with open('validate.json', 'w') as f:
              json.dump({'json_count': json_count, 'total_files': len(files)}, f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"dataset_count={json_count}\n")
          PYEOF

      # 1.4 HTML 结构校验 (P19 enhanced)
      - name: Validate HTML structure
        if: steps.skip.outputs.skip != 'true'
        run: |
          echo "========== HTML structure validation (P24) =========="
          test -f "web_site/index.html" || (echo "index.html missing" >&2; exit 3)
          grep -q "<!DOCTYPE html>" web_site/index.html && echo "DOCTYPE OK"
          grep -q "<html" web_site/index.html && echo "html tag OK"
          grep -q "<body" web_site/index.html && echo "body tag OK"
          grep -q "echarts" web_site/index.html && echo "ECharts CDN OK"
          grep -q "html2canvas" web_site/index.html && echo "html2canvas CDN OK"
          grep -q "alert-timeline" web_site/index.html && echo "Alert timeline OK"
          grep -q "data-completion" web_site/index.html && echo "Data completion OK"
          grep -q "gate-main" web_site/index.html && echo "Gate panel OK"
          grep -q "exportScreenshot" web_site/index.html && echo "Screenshot export OK"
          grep -q "dataZoom" web_site/index.html && echo "DataZoom OK"
          grep -q "version-chips" web_site/index.html && echo "Version switch OK"
          grep -q "pl-table" web_site/index.html && echo "P/L table OK"
          # P19 T2 checks
          grep -q "nisipanel" web_site/index.html && echo "NI/SI panel OK"
          grep -q "renderNISIPanel" web_site/index.html && echo "NI/SI render OK"
          grep -q "ni_si_panels.json, cross_variety_comparison.json, pc003_unlock_assessment.json" web_site/index.html && echo "NI/SI data OK"
          grep -q "completion-board" web_site/index.html && echo "Completion board OK"
          grep -q "FR-RISK" web_site/index.html && echo "FR-RISK linkage OK"
          grep -q "M3" web_site/index.html && echo "M3 milestone OK"
          grep -q "M4" web_site/index.html && echo "M4 milestone OK"
          # P19 T3 checks
          grep -q "offline-banner" web_site/index.html && echo "Offline hint OK"
          grep -q "ECharts" web_site/index.html && echo "ECharts check OK"
          grep -q "P18" web_site/index.html && echo "P18 label OK"
          grep -q "P19" web_site/index.html && echo "P19 label OK"
          # P20 checks
          grep -q "DSHD-P20" web_site/index.html && echo "P20 title OK"
          grep -q "pc003unlock" web_site/index.html && echo "PC003 unlock OK"
          grep -q "renderPC003UnlockPanel" web_site/index.html && echo "PC003 unlock render OK"
          grep -q "cross_variety_comparison.json" web_site/index.html && echo "Cross variety OK"
          grep -q "pc003_unlock_assessment.json" web_site/index.html && echo "Unlock assessment OK"
          grep -q "M5" web_site/index.html && echo "M5 milestone OK"
          grep -q "DSHD-P19" web_site/index.html && echo "P19 title OK"
          grep -q "hdr-dataset-ver" web_site/index.html && echo "Dataset version OK"
          # P21 checks
          grep -Eq "DSHD-P[0-9]+" web_site/index.html && echo "P24 title OK"
          grep -q "portfolio" web_site/index.html && echo "Portfolio view OK"
          grep -q "renderPortfolio" web_site/index.html && echo "Portfolio render OK"
          grep -q "portfolio_backtest.json" web_site/index.html && echo "Portfolio data OK"
          grep -q "portfolio_correlation.json" web_site/index.html && echo "Portfolio correlation OK"
          grep -q "portfolio_risk_metrics.json" web_site/index.html && echo "Portfolio risk OK"
          grep -q "renderCorrelationMatrix" web_site/index.html && echo "Correlation matrix OK"
          grep -q "correlation-matrix" web_site/index.html && echo "Correlation panel OK"
          grep -q "UNLOCKED" web_site/index.html && echo "PC003 UNLOCKED OK"
          grep -q "renderPC003UnlockPanelV21" web_site/index.html && echo "PC003 V21 render OK"
          grep -q "pressure-test-results" web_site/index.html && echo "Pressure test OK"
          grep -q "production-limits" web_site/index.html && echo "Production limits OK"
          grep -q "emergency-shutdown" web_site/index.html && echo "Emergency shutdown OK"
          grep -q "M6" web_site/index.html && echo "M6 milestone OK"
          grep -q "M7" web_site/index.html && echo "M7 milestone OK"
          grep -q "m6-report" web_site/index.html && echo "M6 report OK"
          grep -q "m7-report" web_site/index.html && echo "M7 report OK"
          grep -Eq "P18.*P19.*P20.*P21.*P22.*P23" && echo "P18-P24 version switch OK"
          grep -q "portfolio-nav-chart" web_site/index.html && echo "Portfolio NAV chart OK"
          grep -q "portfolio-risk-panel" web_site/index.html && echo "Portfolio risk panel OK"
          grep -q "factor-ortho-compare" web_site/index.html && echo "Factor ortho compare OK"
          grep -q "portfolio-stop-conditions" web_site/index.html && echo "Portfolio stop conditions OK"
          grep -q "ov-portfolio" web_site/index.html && echo "Portfolio overview OK"
          grep -q "renderPortfolioOverview" web_site/index.html && echo "Portfolio overview render OK"
          grep -q "renderPortfolioNavChart" web_site/index.html && echo "Portfolio NAV render OK"

           # P23 NEW checks
           grep -q "DSHD-P23" web_site/index.html && echo "P23 title OK"
           grep -q "P18+P19+P20+P21+P23" web_site/index.html && echo "P18-P23 version switch OK"
           grep -Eq "P18/P19/P20/P21/P22/P23" web_site/index.html && echo "P18-P24 nav labels OK"
           grep -q "portfolio_risk_contribution" web_site/index.html && echo "Risk contribution ref OK"
           grep -q "renderRiskContribution" web_site/index.html && echo "Risk contribution render OK"
           grep -q "risk-contribution-panel" web_site/index.html && echo "Risk contribution panel OK"
           grep -q "portfolio_risk_contribution.json" web_site/data/dataset_index.json && echo "Risk contribution in index OK"
           grep -q "portfolio_risk_contribution.json" web_site/data/dataset_index.json && echo "Risk contribution data OK"
           grep -q "FR-RISK-PG22-NI-009" web_site/data/fr_risk_alerts.json && echo "FR-RISK-009 NI delay OK"
           grep -q "FR-RISK-PG22-CV-010" web_site/data/fr_risk_alerts.json && echo "FR-RISK-010 CV concentration OK"
           grep -q "risk_inspection_p22" web_site/data/pc003_unlock_assessment.json && echo "P23 risk inspection OK"
           grep -q "ni_delay_monitoring" web_site/data/pc003_unlock_assessment.json && echo "NI delay monitoring OK"
           grep -q "emergency_shutdown_plan" web_site/data/pc003_unlock_assessment.json && echo "Emergency shutdown plan OK"
           grep -q "shutdown_drill" web_site/data/pc003_unlock_assessment.json && echo "Shutdown drill OK"
           grep -q "M6.*COMPLETED" web_site/data/data_completion_status.json && echo "M6 COMPLETED OK"
           grep -q "P23" web_site/data/pc003_unlock_assessment.json && echo "PC003 P23 tag OK"
           grep -Eq "\"version_tag\": "P[0-9]+\"" web_site/data/portfolio_risk_contribution.json && echo "Risk contribution phase tag OK"
